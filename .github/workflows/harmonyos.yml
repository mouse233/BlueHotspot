name: HarmonyOS CI

on:
  push:
    paths:
      - "harmonyos/**"
      - ".github/workflows/harmonyos.yml"
  pull_request:
    paths:
      - "harmonyos/**"
      - ".github/workflows/harmonyos.yml"
  workflow_dispatch:
    inputs:
      command_line_tools_url:
        description: "Direct URL to the Huawei HarmonyOS Command Line Tools ZIP"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  harmonyos:
    name: Build HarmonyOS app
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore HarmonyOS Command Line Tools cache
        id: harmony-tools-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bluehotspot/harmony-command-line-tools/6.0.1.251
          key: harmonyos-command-line-tools-linux-x64-6.0.1.251

      - name: Prepare HarmonyOS Command Line Tools
        env:
          TOOLS_URL: ${{ inputs.command_line_tools_url || vars.HARMONY_COMMAND_LINE_TOOLS_URL || 'https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.0.1.251.zip' }}
          TOOLS_SHA256: ${{ vars.HARMONY_COMMAND_LINE_TOOLS_SHA256 }}
        run: |
          set -euo pipefail

          cache_root="$HOME/.cache/bluehotspot/harmony-command-line-tools/6.0.1.251"
          mkdir -p "$cache_root"
          hvigorw_path="$(find "$cache_root" -type f -path '*/bin/hvigorw' -print -quit)"

          if [[ -z "$hvigorw_path" ]]; then
            if ! command -v aria2c >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq aria2
            fi

            archive="$RUNNER_TEMP/harmony-command-line-tools.zip"
            aria2c \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --continue=true \
              --file-allocation=none \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=1M \
              --max-tries=5 \
              --retry-wait=5 \
              --timeout=60 \
              --connect-timeout=30 \
              --dir="$RUNNER_TEMP" \
              --out="$(basename "$archive")" \
              "$TOOLS_URL"

            if [[ -n "${TOOLS_SHA256//[[:space:]]/}" ]]; then
              expected="${TOOLS_SHA256//[[:space:]]/}"
              expected="${expected,,}"
              actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
              if [[ "$actual" != "$expected" ]]; then
                echo "HarmonyOS Command Line Tools SHA-256 mismatch. Expected $expected, got $actual." >&2
                exit 1
              fi
            fi

            unzip -q "$archive" -d "$cache_root"
            hvigorw_path="$(find "$cache_root" -type f -path '*/bin/hvigorw' -print -quit)"
            if [[ -z "$hvigorw_path" ]]; then
              echo "Could not find Command Line Tools root containing bin/hvigorw." >&2
              exit 1
            fi
          fi

          ohpm_path="$(find "$cache_root" -type f -path '*/bin/ohpm' -print -quit)"
          if [[ -z "$ohpm_path" ]]; then
            echo "Could not find ohpm in the downloaded Command Line Tools." >&2
            exit 1
          fi

          tools_root="$(dirname "$hvigorw_path")"
          while [[ "$tools_root" != "$cache_root" && "$tools_root" != "/" ]]; do
            if [[ -d "$tools_root/sdk" ]]; then
              break
            fi
            tools_root="$(dirname "$tools_root")"
          done
          if [[ ! -d "$tools_root/sdk" ]]; then
            echo "Could not find the SDK directory beside the Command Line Tools." >&2
            exit 1
          fi

          chmod +x "$hvigorw_path" "$ohpm_path"
          echo "HARMONY_TOOLS_ROOT=$tools_root" >> "$GITHUB_ENV"
          echo "HARMONY_HVIGORW=$hvigorw_path" >> "$GITHUB_ENV"
          echo "HARMONY_OHPM=$ohpm_path" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$tools_root/sdk" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$tools_root/sdk/default" >> "$GITHUB_ENV"
          echo "$(dirname "$hvigorw_path")" >> "$GITHUB_PATH"
          echo "$(dirname "$ohpm_path")" >> "$GITHUB_PATH"

      - name: Save HarmonyOS Command Line Tools cache
        if: ${{ always() && steps.harmony-tools-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bluehotspot/harmony-command-line-tools/6.0.1.251
          key: harmonyos-command-line-tools-linux-x64-6.0.1.251

      - name: Install HarmonyOS dependencies
        working-directory: harmonyos
        run: |
          set -euo pipefail
          "$HARMONY_OHPM" install

      - name: Build unsigned HAP and APP
        working-directory: harmonyos
        run: |
          set -euo pipefail
          "$HARMONY_HVIGORW" \
            --mode project \
            -p product=default \
            -p buildMode=debug \
            assembleApp

      - name: Verify build outputs
        working-directory: harmonyos
        run: |
          set -euo pipefail
          mapfile -t hap_files < <(find entry/build/default/outputs/default -maxdepth 1 -type f -name '*.hap')
          mapfile -t app_files < <(find build/outputs/default -maxdepth 1 -type f -name '*.app')
          if (( ${#hap_files[@]} == 0 || ${#app_files[@]} == 0 )); then
            echo "Expected unsigned HAP and APP outputs were not produced." >&2
            exit 1
          fi
          printf '%s\n' "${hap_files[@]}" "${app_files[@]}"

      - name: Upload HarmonyOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BlueHotspot-harmonyos-unsigned
          path: |
            harmonyos/entry/build/default/outputs/default/*.hap
            harmonyos/build/outputs/default/*.app
          if-no-files-found: error
