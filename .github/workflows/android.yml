name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Lint
        run: gradle lint

      - name: Unit tests
        run: gradle test

      - name: Assemble debug APKs
        run: gradle assembleDebug

      - name: Upload Android server APK
        uses: actions/upload-artifact@v7
        with:
          name: BlueHotspot-android-server-debug
          path: android/server/build/outputs/apk/debug/server-debug.apk

      - name: Upload Android client APK
        uses: actions/upload-artifact@v7
        with:
          name: BlueHotspot-android-client-debug
          path: android/client/build/outputs/apk/debug/client-debug.apk
