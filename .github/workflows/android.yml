name: Android CI

on:
  push:
    branches: [main, feat/android-client]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Lint
        run: gradle lint

      - name: Unit tests
        run: gradle test

      - name: Assemble debug APKs
        run: gradle assembleDebug

      - name: Upload Android server APK
        uses: actions/upload-artifact@v6
        with:
          name: BlueHotspot-android-server-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android client APK
        uses: actions/upload-artifact@v6
        with:
          name: BlueHotspot-android-client-debug
          path: android/client/build/outputs/apk/debug/client-debug.apk
