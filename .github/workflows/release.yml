name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        working-directory: ios
        env:
          DERIVED_DATA: ${{ runner.temp }}/BlueHotspot-DerivedData
        run: |
          set -euo pipefail

          project_file="$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          if [[ -z "$project_file" ]]; then
            echo 'No Xcode project was generated.' >&2
            exit 1
          fi

          scheme="$(basename "$project_file" .xcodeproj)"
          xcodebuild \
            -project "$project_file" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          app_path="$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'The unsigned iOS app was not produced.' >&2
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$app_path" "$RUNNER_TEMP/Payload/$(basename "$app_path")"
          mkdir -p "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP" && zip -qry \
            "release-assets/BlueHotspot-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload)

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueHotspot-unsigned-ipa
          path: ${{ runner.temp }}/release-assets/BlueHotspot-${{ github.ref_name }}-ios-unsigned.ipa
          if-no-files-found: error

  android:
    name: Build signed Android APKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            module: server
            alias: bluehotspot-android-server
          - app: client
            module: client
            alias: bluehotspot-android-client

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :${{ matrix.module }}:assembleRelease --stacktrace

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not configured.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bluehotspot-release.jks"

      - name: Sign and verify APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ matrix.alias }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ matrix.app == 'server' && secrets.ANDROID_SERVER_KEY_PASSWORD || secrets.ANDROID_CLIENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo 'ANDROID_KEYSTORE_PASSWORD and the selected alias password are required.' >&2
            exit 1
          fi

          unsigned_apk="$(find . -type f -path '*/build/outputs/apk/release/*.apk' \
            \( -name '*unsigned*.apk' -o -name '*release*.apk' \) \
            -print | sort | head -n 1)"
          if [[ -z "$unsigned_apk" ]]; then
            echo 'The release APK was not produced.' >&2
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          if [[ ! -x "$zipalign" || ! -x "$apksigner" ]]; then
            echo 'Android build tools (zipalign/apksigner) were not found.' >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-assets"
          aligned_apk="$RUNNER_TEMP/BlueHotspot-${{ matrix.app }}-release-aligned.apk"
          signed_apk="$RUNNER_TEMP/release-assets/BlueHotspot-${GITHUB_REF_NAME}-android-${{ matrix.app }}-release.apk"

          "$zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/bluehotspot-release.jks" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_SIGNING_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify --verbose "$signed_apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueHotspot-signed-apk-${{ matrix.app }}
          path: ${{ runner.temp }}/release-assets/BlueHotspot-${{ github.ref_name }}-android-${{ matrix.app }}-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ios, android]

    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BlueHotspot-unsigned-ipa
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BlueHotspot-signed-apk-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 3 ]]; then
            echo "Expected exactly three release assets, found ${#assets[@]}." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_args=(--repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes)
            if [[ "$TAG_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" "${release_args[@]}" "${assets[@]}"
          fi