name: BlueHotspot

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BlueHotspot:
    type: application
    platform: iOS
    sources:
      - path: BlueHotspot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bluehotspot
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      properties:
        CFBundleDisplayName: BlueHotspot
        NSBluetoothAlwaysUsageDescription: BlueHotspot uses Bluetooth to control a trusted Android device.

schemes:
  BlueHotspot:
    build:
      targets:
        BlueHotspot: all
    run:
      config: Debug
    archive:
      config: Release
